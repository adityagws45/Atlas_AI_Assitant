# Atlas AI — Render Blueprint ($0 / free tier)
# FREE only: web + Postgres + Key Value. No Background Worker.
# Local polling remains available: python manage.py run_bot

envVarGroups:
  - name: atlas-ai-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo

services:
  - type: web
    name: atlas-ai-web
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements/prod.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - fromGroup: atlas-ai-shared
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: atlas-ai-redis
          type: keyvalue
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # After deploy: https://<atlas-ai-web>.onrender.com/api/telegram/webhook/
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_LIGHT_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false

  - type: keyvalue
    name: atlas-ai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Internal-only access (required field for Key Value)
    ipAllowList: []
