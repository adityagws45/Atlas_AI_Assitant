services:
  - type: web
    name: atlas-ai-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements/prod.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: atlas-ai-redis
          type: redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
    healthCheckPath: /health/

  - type: worker
    name: atlas-ai-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements/prod.txt
    startCommand: python manage.py run_scheduler
    envVars:
      - fromGroup: atlas-ai-web

  - type: redis
    name: atlas-ai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: atlas-ai-db
    plan: starter
