# Atlas AI — Render Blueprint ($0 / free tier)
# Architecture: FREE Web (Django + Telegram HTTPS webhook + OAuth)
# + FREE Postgres + FREE Redis/Key Value.
# No Background Worker. Local polling remains: python manage.py run_bot

envVarGroups:
  - name: atlas-ai-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: atlas-ai-redis
          type: redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # After deploy: https://<atlas-ai-web>.onrender.com/api/telegram/webhook/
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_LIGHT_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: FINNHUB_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false

services:
  - type: web
    name: atlas-ai-web
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements/prod.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - fromGroup: atlas-ai-shared

  - type: redis
    name: atlas-ai-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: atlas-ai-db
    plan: free
